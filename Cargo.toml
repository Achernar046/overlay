[workspace]
resolver = "2"
members = ["crates/core", "crates/collector", "crates/daemon", "crates/tui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
sysmon-core = { path = "crates/core" }
sysmon-collector = { path = "crates/collector" }
sysinfo = { version = "0.40", default-features = false, features = ["system", "disk", "network", "component", "gpu"] }
smallvec = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
ratatui = "0.30"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
